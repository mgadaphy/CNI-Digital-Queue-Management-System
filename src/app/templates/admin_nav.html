<div class="admin-header bg-light border-bottom">
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid px-0">
                <a class="navbar-brand" href="{{ url_for('main.index') }}">
                    <i class="fas fa-building me-2"></i>CNI Queue Management
                </a>
                <div class="navbar-nav">
                    <a class="nav-link {{ 'active' if request.endpoint == 'admin.admin_dashboard' else '' }}"
                        href="{{ url_for('admin.admin_dashboard') }}">
                        <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                    </a>
                    <a class="nav-link {{ 'active' if request.endpoint == 'admin.manage_agents' else '' }}"
                        href="{{ url_for('admin.manage_agents') }}">
                        <i class="fas fa-users me-1"></i>Agents
                    </a>
                    <a class="nav-link {{ 'active' if request.endpoint == 'admin.manage_service_types' else '' }}"
                        href="{{ url_for('admin.manage_service_types') }}">
                        <i class="fas fa-cogs me-1"></i>Service Types
                    </a>
                    <a class="nav-link {{ 'active' if request.endpoint == 'admin.manage_stations' else '' }}"
                        href="{{ url_for('admin.manage_stations') }}">
                        <i class="fas fa-desktop me-1"></i>Stations
                    </a>
                    <a class="nav-link {{ 'active' if request.endpoint == 'admin.manage_citizens' else '' }}"
                        href="{{ url_for('admin.manage_citizens') }}">
                        <i class="fas fa-user-friends me-1"></i>Citizens
                    </a>
                    <a class="nav-link {{ 'active' if request.endpoint == 'admin.manage_queue' else '' }}"
                        href="{{ url_for('admin.manage_queue') }}">
                        <i class="fas fa-list-ol me-1"></i>Queue
                    </a>
                    <a class="nav-link {{ 'active' if request.endpoint == 'admin.system_reports' else '' }}"
                        href="{{ url_for('admin.system_reports') }}">
                        <i class="fas fa-chart-bar me-1"></i>Reports
                    </a>
                </div>
                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            {% if current_user %}
                            {{ current_user.first_name }} {{ current_user.last_name }}
                            {% else %}
                            Admin User
                            {% endif %}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="{{ url_for('admin.admin_profile') }}"><i
                                        class="fas fa-user me-2"></i>Profile</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('admin.admin_settings') }}"><i
                                        class="fas fa-cog me-2"></i>Settings</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="{{ url_for('auth.logout') }}"
                                    onclick="handleLogout(event)"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</div>
